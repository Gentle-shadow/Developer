name: Clean 1XBET Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download apktool
        run: wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
      - name: Decompile
        run: java -jar apktool.jar d base.apk -o base_decoded -f
      - name: Patch
        run: python3 patch.py
      - name: Rebuild
        run: java -jar apktool.jar b base_decoded -o 1xbet_clean_unsigned.apk -f
      - name: Sign
        run: |
          BT=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -v 4 1xbet_clean_unsigned.apk 1xbet_clean_aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks keys/shadow.keystore \
            --ks-key-alias shadow \
            --ks-pass pass:shadow123 \
            --key-pass pass:shadow123 \
            --out 1xbet_clean_signed.apk \
            1xbet_clean_aligned.apk
      - name: Verify
        run: |
          BT=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          echo "═══ FILE ═══"
          ls -la 1xbet_clean_signed.apk
          echo "═══ SIGNATURE ═══"
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs 1xbet_clean_signed.apk 2>&1 | head -5
          echo "═══ BADGING ═══"
          $ANDROID_HOME/build-tools/$BT/aapt2 dump badging 1xbet_clean_signed.apk 2>&1 | head -5
          echo "═══ SPLIT CHECK ═══"
          $ANDROID_HOME/build-tools/$BT/aapt2 dump xmltree 1xbet_clean_signed.apk --file AndroidManifest.xml 2>&1 | grep -iE "isSplit|extractNativeLibs" | head -5 || echo "No split declarations — GOOD"
      - name: Tag
        id: t
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: clean-${{ steps.t.outputs.ts }}
          name: "Clean 1XBET ${{ steps.t.outputs.ts }}"
          body: "Clean merged base.apk, no Frida. Testing install."
          files: 1xbet_clean_signed.apk

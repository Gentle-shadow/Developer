name: In-Place 1XBET Patch

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download apktool (for smali compile)
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Decompile base.apk
        run: |
          java -jar apktool.jar d base.apk -o base_decoded -f
          echo "═══ DECODED ═══"
          ls -la base_decoded/ | head -15

      - name: Apply in-place patch
        run: |
          python3 patch.py

      - name: Sign APK
        run: |
          BT=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -v 4 1xbet_patched.apk 1xbet_aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks keys/shadow.keystore \
            --ks-key-alias shadow \
            --ks-pass pass:shadow123 \
            --key-pass pass:shadow123 \
            --out 1xbet_signed.apk \
            1xbet_aligned.apk

      - name: Verify
        run: |
          BT=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          echo "═══ FILE ═══"
          ls -la 1xbet_signed.apk
          echo "═══ SIGNATURE ═══"
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs 1xbet_signed.apk 2>&1 | head -5
          echo "═══ CONTENTS ═══"
          unzip -l 1xbet_signed.apk | grep -E "classes3|libfrida|frida_script" 
          echo "═══ ZIP INTEGRITY ═══"
          unzip -t 1xbet_signed.apk 2>&1 | tail -3

      - name: Tag
        id: t
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: inplace-${{ steps.t.outputs.ts }}
          name: "1XBET In-Place ${{ steps.t.outputs.ts }}"
          body: "In-place patch — original resources, patched classes3.dex, Frida added"
          files: 1xbet_signed.apk

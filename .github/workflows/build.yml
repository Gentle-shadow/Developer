name: In-Place 1XBET Patch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Apktool (v3.0.3 with fallback)
        run: |
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          wget -q --show-progress "$APKTOOL_URL" -O apktool.jar || \
          wget -q --show-progress "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O apktool.jar || \
          wget -q --show-progress "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.4/apktool_2.9.4.jar" -O apktool.jar || \
          { echo "❌ All download URLs failed"; exit 1; }
          
          if ! file apktool.jar | grep -q "Java archive"; then
              echo "❌ Downloaded file is not a valid JAR"
              file apktool.jar
              exit 1
          fi
          java -jar apktool.jar --version

      - name: Download smali/baksmali
        run: |
          wget -q https://github.com/baksmali/smali/releases/download/v3.0.5/smali-3.0.5.jar -O smali.jar || \
          wget -q https://github.com/google/smali/releases/download/v3.0.5/smali-3.0.5.jar -O smali.jar
          
          wget -q https://github.com/baksmali/smali/releases/download/v3.0.5/baksmali-3.0.5.jar -O baksmali.jar || \
          wget -q https://github.com/google/smali/releases/download/v3.0.5/baksmali-3.0.5.jar -O baksmali.jar
          
          java -jar smali.jar --version
          java -jar baksmali.jar --version

      - name: Decode APK (with splits)
        run: |
          # Apktool v3 auto-detects split_config files in the same folder
          java -jar apktool.jar d base.apk -o base_decoded -f
          
          if [ ! -d "base_decoded/smali" ] && [ ! -d "base_decoded/smali_classes2" ]; then
              echo "❌ Decode failed"
              ls -la base_decoded/
              exit 1
          fi
          echo "✅ Decode successful"
          ls -la base_decoded/ | head

      - name: Run patch.py
        run: |
          python3 patch.py

      - name: Zipalign
        run: |
          # GitHub runners have Android SDK pre-installed
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          echo "Using zipalign: $ZIPALIGN"
          $ZIPALIGN -f -p 4 1xbet_patched.apk 1xbet_aligned.apk

      - name: Sign APK
        run: |
          # Generate key if not present
          if [ ! -f mod.keystore ]; then
              keytool -genkeypair -v \
                  -keystore mod.keystore \
                  -alias modkey \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass modpass -keypass modpass \
                  -dname "CN=Mod, OU=Mod, O=Mod, L=Mod, S=Mod, C=US"
          fi
          
          # Sign
          apksigner sign \
              --ks mod.keystore \
              --ks-pass pass:modpass \
              --key-pass pass:modpass \
              --out 1xbet_signed.apk \
              1xbet_aligned.apk
          
          apksigner verify --verbose 1xbet_signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1xbet-modded
          path: 1xbet_signed.apk
          retention-days: 7

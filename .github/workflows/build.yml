name: Build Modded 1XBET

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          ls -la apktool.jar

      - name: Decompile base.apk
        run: |
          java -jar apktool.jar d base.apk -o base_decoded -f
          ls -la base_decoded/ | head -20

      - name: Apply patch
        run: python3 patch.py

      - name: Rebuild APK
        run: java -jar apktool.jar b base_decoded -o 1xbet_modded_unsigned.apk -f

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v 4 \
            1xbet_modded_unsigned.apk 1xbet_modded_aligned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks keys/shadow.keystore \
            --ks-key-alias shadow \
            --ks-pass pass:shadow123 \
            --key-pass pass:shadow123 \
            --out 1xbet_modded_signed.apk \
            1xbet_modded_aligned.apk
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --print-certs \
            1xbet_modded_signed.apk

      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.timestamp.outputs.ts }}
          name: "1XBET Mod ${{ steps.timestamp.outputs.ts }}"
          body: |
            Auto-built 1XBET with Frida Gadget injected.
            
            **Install:**
            1. Uninstall original 1XBET
            2. Download `1xbet_modded_signed.apk`
            3. Tap to install
          files: 1xbet_modded_signed.apk
          draft: false
          prerelease: false
